// src/app/features/home/pages/home-page/home-page.component.html
<div class="container mx-auto px-4 py-8">
    <!-- Hero Section -->
    <section class="mb-12">
        <div class="bg-gradient-to-r from-blue-500 to-purple-600 rounded-lg p-8 text-white">
            <h1 class="text-4xl font-bold mb-4">Welcome to Our Shop</h1>
            <p class="text-xl mb-6">Discover amazing products at great prices</p>
            <button class="bg-white text-blue-600 px-6 py-2 rounded-full font-semibold hover:bg-gray-100">
                Shop Now
            </button>
        </div>
    </section>

    <!-- Categories Section -->
    <section class="mb-12">
        <h2 class="text-2xl font-bold mb-6">Shop by Category</h2>
        <div *ngIf="isLoading" class="text-center">
            <span class="loading">Loading categories...</span>
        </div>
        <div *ngIf="error" class="text-red-500 text-center">
            {{ error }}
        </div>
        <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
            <div *ngFor="let category of categories" class="p-4 border rounded-lg hover:shadow-lg transition-shadow">
                <h3 class="text-lg font-semibold">{{ category.name }}</h3>
                <a [routerLink]="['/category', category.id]" class="text-blue-600 hover:underline">
                    View Products
                </a>
            </div>
        </div>
    </section>

    <!-- Featured Products Section -->
    <section>
        <h2 class="text-2xl font-bold mb-6">Featured Products</h2>
        <div *ngIf="isLoading" class="text-center">
            <span class="loading">Loading products...</span>
        </div>
        <div *ngIf="error" class="text-red-500 text-center">
            {{ error }}
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <app-product-card
                    *ngFor="let product of featuredProducts"
                    [product]="product"
            ></app-product-card>
        </div>
    </section>
</div>
